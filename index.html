<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Links</title>
    <!-- Menggunakan font Google 'Public Sans' yang cocok untuk desain bold/brutalism -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* === VARIABEL WARNA & STYLE === */
        :root {
            /* Warna Solid */
            --border-color: #000000;
            --shadow-color: #000000;
            --btn-pink: #FF66C4;
            --btn-red: #FF3B30;
            
            /* Warna Kaca (Glassmorphism) */
            --glass-white: rgba(255, 255, 255, 0.4);
            --glass-blue: rgba(56, 182, 255, 0.4);
            --glass-green: rgba(140, 255, 158, 0.4);
            
            /* Efek */
            --border-width: 4px;
            --glass-blur: blur(16px);
        }

        /* === RESET & BASE STYLES === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            color: var(--border-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f8f9fa; /* Fallback color */
        }

        /* === LIQUID ANIMATED BACKGROUND === */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #fff9e6; /* Kuning sangat muda */
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.8;
            animation: float 12s infinite alternate ease-in-out;
        }

        .blob-1 {
            background: #FF66C4; /* Pink */
            width: 45vw;
            height: 45vw;
            top: -10%;
            left: -10%;
            animation-duration: 15s;
        }

        .blob-2 {
            background: #38B6FF; /* Biru */
            width: 50vw;
            height: 50vw;
            bottom: -20%;
            right: -10%;
            animation-duration: 18s;
            animation-direction: alternate-reverse;
        }

        .blob-3 {
            background: #FFDE59; /* Kuning */
            width: 40vw;
            height: 40vw;
            top: 30%;
            left: 30%;
            animation-duration: 12s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(40px, 60px) scale(1.05); }
        }

        .container {
            width: 100%;
            max-width: 768px; /* Ukuran max untuk Desktop/Tablet */
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
            z-index: 1; /* Berada di atas background */
        }

        /* === GLOBAL NEUBRUTALISM X GLASSMORPHISM CLASS === */
        .glass-brutal {
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 16px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur); /* Safari support */
        }

        /* === HEADER === */
        header {
            text-align: center;
            padding: 25px;
            background: var(--glass-blue);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #fff; /* Agar teks lebih terbaca di atas kaca */
        }

        /* === VIDEO YOUTUBE RESPONSIVE === */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            background: #000; /* Background hitam saat loading */
            overflow: hidden;
            /* Glass Brutal di-apply terpisah agar shadow pas */
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 16px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* === FORM TAMBAH LINK === */
        .form-section {
            background: var(--glass-white);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section h2 {
            font-size: 1.6rem;
            font-weight: 900;
            text-shadow: 1px 1px 0px #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 18px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            background-color: rgba(255, 255, 255, 0.7); /* Semi transparan putih */
            border: 3px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background-color: #fff;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transform: translate(-2px, -2px);
        }

        button.btn-add {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 900;
            font-family: inherit;
            background-color: var(--btn-pink); /* Warna solid brutalism */
            color: var(--border-color);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        button.btn-add:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        /* === DAFTAR VIDEO DINAMIS === */
        #links-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-bottom: 50px;
        }

        /* Card baru untuk Video Dinamis */
        .dynamic-video-card {
            background: var(--glass-green);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .dynamic-video-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px var(--shadow-color);
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-title {
            font-size: 1.4rem;
            font-weight: 900;
            text-shadow: 1px 1px 0px #fff;
        }

        .btn-delete {
            background-color: var(--btn-red);
            color: white;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-delete:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        /* === MEDIA QUERIES (RESPONSIVE) === */
        /* Tablet & Desktop */
        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
            .input-group input {
                flex: 1;
            }
            button.btn-add {
                align-self: flex-start;
                padding: 18px 35px;
            }
        }
        
        /* Mobile Small Adjustments */
        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            .blob { filter: blur(40px); }
            .video-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    
    <!-- Latar Belakang Liquid -->
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Bagian Header -->
        <header class="glass-brutal">
            <h1>✨ My Zone ✨</h1>
        </header>

        <!-- Bagian Video YouTube Utama -->
        <div class="video-container">
            <!-- Iframe menggunakan youtube-nocookie.com untuk menghindari error di layar pratinjau -->
            <iframe src="https://www.youtube-nocookie.com/embed/7TY11F_8_Go" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Bagian Form Tambah Video -->
        <div class="form-section glass-brutal">
            <h2>➕ Tambah Video YouTube Lainnya</h2>
            <form id="add-video-form">
                <div class="input-group">
                    <input type="text" id="video-title" placeholder="Judul (Cth: Vlog Bali)" required>
                    <!-- Mengubah tipe input ke text agar bisa menampung kode <iframe> -->
                    <input type="text" id="video-embed" placeholder="Paste kode <iframe ...> dari YouTube di sini" required>
                </div>
                <button type="submit" class="btn-add">Tambahkan Video!</button>
            </form>
        </div>

        <!-- Bagian Daftar Video Dinamis -->
        <div id="links-container">
            <!-- Video-video tambahan akan muncul di sini secara dinamis -->
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-video-form');
            const linksContainer = document.getElementById('links-container');
            const titleInput = document.getElementById('video-title');
            const embedInput = document.getElementById('video-embed');

            // Kunci untuk menyimpan data di LocalStorage browser
            const STORAGE_KEY = 'neubrutalism_videos';

            // 1. Mengambil data video dari LocalStorage
            const getVideos = () => {
                const videos = localStorage.getItem(STORAGE_KEY);
                return videos ? JSON.parse(videos) : [];
            };

            // 2. Menyimpan data video ke LocalStorage
            const saveVideos = (videos) => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
            };

            // 3. Menampilkan daftar video ke layar (Render UI)
            const renderVideos = () => {
                linksContainer.innerHTML = ''; // Kosongkan kontainer dulu
                const videos = getVideos();
                
                videos.forEach((video, index) => {
                    // Membuat bungkus card dengan style kombinasi Glassmorphism x Neubrutalism
                    const card = document.createElement('div');
                    card.className = 'dynamic-video-card glass-brutal';
                    
                    // Bagian Header (Judul & Tombol Hapus)
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'video-header';

                    const titleEl = document.createElement('h3');
                    titleEl.className = 'video-title';
                    titleEl.textContent = video.title;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = 'HAPUS';
                    deleteBtn.onclick = () => deleteVideo(index);

                    headerDiv.appendChild(titleEl);
                    headerDiv.appendChild(deleteBtn);

                    // Bagian Kontainer Video (Responsif 16:9)
                    const vidContainer = document.createElement('div');
                    vidContainer.className = 'video-container';

                    const iframeEl = document.createElement('iframe');
                    iframeEl.src = video.src; // Memasukkan URL src yang sudah diekstrak
                    iframeEl.title = video.title;
                    iframeEl.frameBorder = '0';
                    iframeEl.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframeEl.allowFullscreen = true;

                    vidContainer.appendChild(iframeEl);

                    // Memasukkan elemen ke dalam card, lalu ke layar
                    card.appendChild(headerDiv);
                    card.appendChild(vidContainer);
                    linksContainer.appendChild(card);
                });
            };

            // 4. Aksi saat form disubmit (Menambah Video)
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Mencegah halaman me-refresh
                
                const newTitle = titleInput.value.trim();
                const embedCode = embedInput.value.trim();

                // Mengekstrak URL "src" dari kode <iframe> yang di-paste oleh user
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = embedCode;
                const iframeTag = tempDiv.querySelector('iframe');
                
                let extractedSrc = '';

                if (iframeTag && iframeTag.src) {
                    extractedSrc = iframeTag.src;
                    
                    // (Opsional) Mengubah youtube.com ke youtube-nocookie.com agar pratinjau aman
                    if(extractedSrc.includes('youtube.com')) {
                        extractedSrc = extractedSrc.replace('youtube.com', 'youtube-nocookie.com');
                    }
                } else {
                    alert('Mohon paste kode <iframe ...> yang valid dari fitur "Semartkan / Embed" YouTube!');
                    return; // Hentikan eksekusi jika tidak valid
                }

                if(newTitle && extractedSrc) {
                    const videos = getVideos();
                    videos.push({ title: newTitle, src: extractedSrc });
                    saveVideos(videos);
                    
                    // Kosongkan inputan form
                    titleInput.value = '';
                    embedInput.value = '';
                    
                    // Update tampilan
                    renderVideos();
                }
            });

            // 5. Fungsi menghapus video berdasarkan urutan (index)
            const deleteVideo = (index) => {
                const videos = getVideos();
                videos.splice(index, 1); // Hapus 1 item dari array
                saveVideos(videos); // Simpan kembali array yang baru
                renderVideos(); // Update tampilan
            };

            // Render daftar video saat halaman pertama kali dimuat
            renderVideos();
        });
    </script>
</body>
</html>
