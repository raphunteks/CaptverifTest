<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Links</title>
    <!-- Menggunakan font Google 'Public Sans' yang cocok untuk desain bold/brutalism -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* === VARIABEL WARNA NEUBRUTALISM === */
        :root {
            --bg-color: #FFDE59; /* Kuning cerah */
            --card-blue: #38B6FF; /* Biru cerah */
            --btn-pink: #FF66C4; /* Pink cerah */
            --link-green: #8CFF9E; /* Hijau cerah */
            --border-color: #000000;
            --shadow-color: #000000;
            --border-width: 4px;
        }

        /* === RESET & BASE STYLES === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--border-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 768px; /* Ukuran max untuk Desktop/Tablet */
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* === HEADER === */
        header {
            text-align: center;
            padding: 20px;
            background-color: var(--card-blue);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* === VIDEO YOUTUBE RESPONSIVE === */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
            background: #000; /* Background hitam saat loading */
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* === FORM TAMBAH LINK === */
        .form-section {
            background-color: #FFFFFF;
            padding: 25px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-section h2 {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            background-color: #f0f0f0;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background-color: #fff;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transform: translate(-2px, -2px);
        }

        button.btn-add {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 900;
            font-family: inherit;
            background-color: var(--btn-pink);
            color: var(--border-color);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        button.btn-add:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        /* === DAFTAR VIDEO DINAMIS === */
        #links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card baru untuk Video Dinamis */
        .dynamic-video-card {
            background-color: var(--link-green);
            padding: 20px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .dynamic-video-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 10px 10px 0px var(--shadow-color);
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--border-color);
        }

        .btn-delete {
            background-color: #FF3B30;
            color: white;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn-delete:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        /* === MEDIA QUERIES (RESPONSIVE) === */
        /* Tablet & Desktop */
        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
            .input-group input {
                flex: 1;
            }
            button.btn-add {
                align-self: flex-start;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bagian Header -->
        <header>
            <h1>🔥 My Zone 🔥</h1>
        </header>

        <!-- Bagian Video YouTube Utama -->
        <div class="video-container">
            <!-- Iframe menggunakan youtube-nocookie.com untuk menghindari error di layar pratinjau -->
            <iframe src="https://www.youtube-nocookie.com/embed/7TY11F_8_Go" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Bagian Form Tambah Video -->
        <div class="form-section">
            <h2>➕ Tambah Video YouTube Lainnya</h2>
            <form id="add-video-form">
                <div class="input-group">
                    <input type="text" id="video-title" placeholder="Judul (Cth: Vlog Bali)" required>
                    <!-- Mengubah tipe input ke text agar bisa menampung kode <iframe> -->
                    <input type="text" id="video-embed" placeholder="Paste kode <iframe ...> dari YouTube di sini" required>
                </div>
                <button type="submit" class="btn-add">Tambahkan Video!</button>
            </form>
        </div>

        <!-- Bagian Daftar Video Dinamis -->
        <div id="links-container">
            <!-- Video-video tambahan akan muncul di sini secara dinamis -->
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-video-form');
            const linksContainer = document.getElementById('links-container');
            const titleInput = document.getElementById('video-title');
            const embedInput = document.getElementById('video-embed');

            // Kunci untuk menyimpan data di LocalStorage browser
            const STORAGE_KEY = 'neubrutalism_videos';

            // 1. Mengambil data video dari LocalStorage
            const getVideos = () => {
                const videos = localStorage.getItem(STORAGE_KEY);
                return videos ? JSON.parse(videos) : [];
            };

            // 2. Menyimpan data video ke LocalStorage
            const saveVideos = (videos) => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
            };

            // 3. Menampilkan daftar video ke layar (Render UI)
            const renderVideos = () => {
                linksContainer.innerHTML = ''; // Kosongkan kontainer dulu
                const videos = getVideos();
                
                videos.forEach((video, index) => {
                    // Membuat bungkus card
                    const card = document.createElement('div');
                    card.className = 'dynamic-video-card';
                    
                    // Bagian Header (Judul & Tombol Hapus)
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'video-header';

                    const titleEl = document.createElement('h3');
                    titleEl.className = 'video-title';
                    titleEl.textContent = video.title;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = 'HAPUS';
                    deleteBtn.onclick = () => deleteVideo(index);

                    headerDiv.appendChild(titleEl);
                    headerDiv.appendChild(deleteBtn);

                    // Bagian Kontainer Video (Responsif 16:9)
                    const vidContainer = document.createElement('div');
                    vidContainer.className = 'video-container';

                    const iframeEl = document.createElement('iframe');
                    iframeEl.src = video.src; // Memasukkan URL src yang sudah diekstrak
                    iframeEl.title = video.title;
                    iframeEl.frameBorder = '0';
                    iframeEl.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframeEl.allowFullscreen = true;

                    vidContainer.appendChild(iframeEl);

                    // Memasukkan elemen ke dalam card, lalu ke layar
                    card.appendChild(headerDiv);
                    card.appendChild(vidContainer);
                    linksContainer.appendChild(card);
                });
            };

            // 4. Aksi saat form disubmit (Menambah Video)
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Mencegah halaman me-refresh
                
                const newTitle = titleInput.value.trim();
                const embedCode = embedInput.value.trim();

                // Mengekstrak URL "src" dari kode <iframe> yang di-paste oleh user
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = embedCode;
                const iframeTag = tempDiv.querySelector('iframe');
                
                let extractedSrc = '';

                if (iframeTag && iframeTag.src) {
                    extractedSrc = iframeTag.src;
                    
                    // (Opsional) Mengubah youtube.com ke youtube-nocookie.com agar pratinjau aman
                    if(extractedSrc.includes('youtube.com')) {
                        extractedSrc = extractedSrc.replace('youtube.com', 'youtube-nocookie.com');
                    }
                } else {
                    alert('Mohon paste kode <iframe ...> yang valid dari fitur "Semartkan / Embed" YouTube!');
                    return; // Hentikan eksekusi jika tidak valid
                }

                if(newTitle && extractedSrc) {
                    const videos = getVideos();
                    videos.push({ title: newTitle, src: extractedSrc });
                    saveVideos(videos);
                    
                    // Kosongkan inputan form
                    titleInput.value = '';
                    embedInput.value = '';
                    
                    // Update tampilan
                    renderVideos();
                }
            });

            // 5. Fungsi menghapus video berdasarkan urutan (index)
            const deleteVideo = (index) => {
                const videos = getVideos();
                videos.splice(index, 1); // Hapus 1 item dari array
                saveVideos(videos); // Simpan kembali array yang baru
                renderVideos(); // Update tampilan
            };

            // Render daftar video saat halaman pertama kali dimuat
            renderVideos();
        });
    </script>
</body>
</html>
