<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Links</title>
    <!-- Menggunakan font Google 'Public Sans' yang cocok untuk desain bold/brutalism -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* === VARIABEL WARNA NEUBRUTALISM === */
        :root {
            --bg-color: #FFDE59; /* Kuning cerah */
            --card-blue: #38B6FF; /* Biru cerah */
            --btn-pink: #FF66C4; /* Pink cerah */
            --link-green: #8CFF9E; /* Hijau cerah */
            --border-color: #000000;
            --shadow-color: #000000;
            --border-width: 4px;
        }

        /* === RESET & BASE STYLES === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--border-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 768px; /* Ukuran max untuk Desktop/Tablet */
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* === HEADER === */
        header {
            text-align: center;
            padding: 20px;
            background-color: var(--card-blue);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* === VIDEO YOUTUBE RESPONSIVE === */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
            background: #000; /* Background hitam saat loading */
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* === FORM TAMBAH LINK === */
        .form-section {
            background-color: #FFFFFF;
            padding: 25px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-section h2 {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            background-color: #f0f0f0;
            border: 3px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            background-color: #fff;
            box-shadow: 4px 4px 0px var(--shadow-color);
            transform: translate(-2px, -2px);
        }

        button.btn-add {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 900;
            font-family: inherit;
            background-color: var(--btn-pink);
            color: var(--border-color);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        button.btn-add:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        /* === DAFTAR LINK DINAMIS === */
        #links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dynamic-link-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--link-green);
            padding: 15px 20px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .dynamic-link-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 10px 10px 0px var(--shadow-color);
        }

        .link-content {
            flex-grow: 1;
            text-decoration: none;
            color: var(--border-color);
            font-size: 1.2rem;
            font-weight: 900;
            word-break: break-word; /* Mencegah teks meluber di mobile */
            display: flex;
            align-items: center;
        }

        .btn-delete {
            background-color: #FF3B30;
            color: white;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--shadow-color);
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            margin-left: 15px;
            transition: all 0.1s ease;
        }

        .btn-delete:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--shadow-color);
        }

        /* === MEDIA QUERIES (RESPONSIVE) === */
        /* Tablet & Desktop */
        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
            .input-group input {
                flex: 1;
            }
            button.btn-add {
                align-self: flex-start;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bagian Header -->
        <header>
            <h1>🔥 My Zone 🔥</h1>
        </header>

        <!-- Bagian Video YouTube -->
        <div class="video-container">
            <!-- Iframe menggunakan youtube-nocookie.com untuk menghindari error di layar pratinjau -->
            <iframe src="https://www.youtube-nocookie.com/embed/7TY11F_8_Go" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <!-- Bagian Form Tambah Link -->
        <div class="form-section">
            <h2>➕ Tambah Link Baru</h2>
            <form id="add-link-form">
                <div class="input-group">
                    <input type="text" id="link-title" placeholder="Nama Link (Contoh: Instagram)" required>
                    <input type="url" id="link-url" placeholder="URL (Contoh: https://instagram.com/)" required>
                </div>
                <button type="submit" class="btn-add">Tambahkan!</button>
            </form>
        </div>

        <!-- Bagian Daftar Link -->
        <div id="links-container">
            <!-- Link yang ditambahkan akan muncul di sini secara dinamis -->
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-link-form');
            const linksContainer = document.getElementById('links-container');
            const titleInput = document.getElementById('link-title');
            const urlInput = document.getElementById('link-url');

            // Kunci untuk menyimpan data di LocalStorage browser
            const STORAGE_KEY = 'neubrutalism_links';

            // 1. Mengambil data link dari LocalStorage
            const getLinks = () => {
                const links = localStorage.getItem(STORAGE_KEY);
                return links ? JSON.parse(links) : [];
            };

            // 2. Menyimpan data link ke LocalStorage
            const saveLinks = (links) => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
            };

            // 3. Menampilkan daftar link ke layar (Render UI)
            const renderLinks = () => {
                linksContainer.innerHTML = ''; // Kosongkan kontainer dulu
                const links = getLinks();
                
                links.forEach((link, index) => {
                    // Membuat bungkus card
                    const card = document.createElement('div');
                    card.className = 'dynamic-link-card';
                    
                    // Membuat elemen teks link (Bisa di-klik)
                    const linkEl = document.createElement('a');
                    linkEl.href = link.url;
                    linkEl.target = '_blank'; // Membuka link di tab baru
                    linkEl.className = 'link-content';
                    linkEl.textContent = link.title;
                    
                    // Membuat tombol hapus
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = 'HAPUS';
                    
                    // Aksi saat tombol hapus diklik
                    deleteBtn.onclick = () => {
                        deleteLink(index);
                    };

                    // Memasukkan elemen ke dalam card, lalu ke layar
                    card.appendChild(linkEl);
                    card.appendChild(deleteBtn);
                    linksContainer.appendChild(card);
                });
            };

            // 4. Aksi saat form disubmit (Menambah link)
            form.addEventListener('submit', (e) => {
                e.preventDefault(); // Mencegah halaman me-refresh
                
                const newTitle = titleInput.value.trim();
                let newUrl = urlInput.value.trim();

                if(newTitle && newUrl) {
                    const links = getLinks();
                    links.push({ title: newTitle, url: newUrl });
                    saveLinks(links);
                    
                    // Kosongkan inputan form
                    titleInput.value = '';
                    urlInput.value = '';
                    
                    // Update tampilan
                    renderLinks();
                }
            });

            // 5. Fungsi menghapus link berdasarkan urutan (index)
            const deleteLink = (index) => {
                const links = getLinks();
                links.splice(index, 1); // Hapus 1 item dari array
                saveLinks(links); // Simpan kembali array yang baru
                renderLinks(); // Update tampilan
            };

            // Render daftar link saat halaman pertama kali dimuat
            renderLinks();
        });
    </script>
</body>
</html>
