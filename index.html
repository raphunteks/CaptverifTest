<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Links - Super Expand</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* === VARIABEL WARNA & STYLE === */
        :root {
            --border-color: #111111;
            --shadow-color: #111111;
            --btn-pink: #FF66C4;
            --btn-red: #FF3B30;
            --btn-yellow: #FFDE59;
            --btn-cyan: #38B6FF;
            
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-blue: rgba(56, 182, 255, 0.45);
            --glass-green: rgba(140, 255, 158, 0.9);
            
            --border-width: 4px;
            --glass-blur: blur(12px);
            /* Transisi super smooth untuk efek expand */
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); 
            --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Public Sans', sans-serif;
            color: var(--border-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f8f9fa;
        }

        /* CUSTOM SCROLLBAR */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: #fff9e6; border-left: var(--border-width) solid var(--border-color); }
        ::-webkit-scrollbar-thumb { background-color: var(--btn-pink); border: 3px solid var(--border-color); border-radius: 10px; }

        /* === LIQUID BACKGROUND === */
        .liquid-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; background-color: #fffaeb; overflow: hidden;
        }
        .blob {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.85;
            animation: float-blob 15s infinite alternate ease-in-out;
        }
        .blob-1 { background: #FF66C4; width: 45vw; height: 45vw; top: -10%; left: -10%; animation-duration: 18s; }
        .blob-2 { background: #38B6FF; width: 50vw; height: 50vw; bottom: -20%; right: -10%; animation-duration: 22s; animation-direction: alternate-reverse; }
        .blob-3 { background: #FFDE59; width: 40vw; height: 40vw; top: 30%; left: 30%; animation-duration: 15s; }

        @keyframes float-blob {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(50px, -50px) scale(1.2) rotate(10deg); }
            100% { transform: translate(-30px, 50px) scale(0.9) rotate(-10deg); }
        }

        .container {
            width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 35px;
            position: relative; z-index: 1; padding-bottom: 60px;
        }

        /* HEADER */
        header {
            text-align: center; padding: 25px; background: var(--glass-blue);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color); border-radius: 16px;
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            animation: float-header 4s ease-in-out infinite;
        }
        @keyframes float-header { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        header h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; text-shadow: 2px 2px 0px #fff; }

        /* VIDEO UTAMA */
        .video-wrapper {
            background: rgba(255,255,255,0.4); padding: 15px; border-radius: 16px;
            border: var(--border-width) solid var(--border-color); box-shadow: 8px 8px 0px var(--shadow-color);
            backdrop-filter: var(--glass-blur);
        }
        .video-container {
            position: relative; width: 100%; padding-bottom: 56.25%; background: #000;
            border: var(--border-width) solid var(--border-color); border-radius: 12px; overflow: hidden;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* ========================================================
           SUPER UPGRADE 1: HOVER EXPANDING FORM (LOGIN STYLE) 
           ======================================================== */
        .form-wrapper-center { display: flex; justify-content: center; width: 100%; }
        
        .expandable-form {
            background: var(--btn-pink); /* Awalnya Pink Solid */
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 50px; /* Bentuk Pill/Kapsul saat kecil */
            width: 320px; /* Lebar kecil (hanya tombol) */
            padding: 15px 30px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.6s var(--ease-bounce);
            backdrop-filter: var(--glass-blur);
        }

        /* Saat di Hover ATAU sedang di-klik (focus) */
        .expandable-form:hover, 
        .expandable-form:focus-within,
        .expandable-form.mobile-expanded {
            width: 100%; /* Melebar Full */
            border-radius: 16px; /* Jadi Kotak Normal */
            background: var(--glass-white); /* Berubah jadi Kaca Transparan */
            padding: 35px;
            cursor: default;
            box-shadow: 12px 12px 0px var(--shadow-color);
        }

        .form-summary {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            font-size: 1.4rem; font-weight: 900; color: var(--border-color);
            transition: all 0.4s var(--ease-smooth); white-space: nowrap;
        }
        
        /* Ubah Header Form saat mengembang */
        .expandable-form:hover .form-summary, 
        .expandable-form:focus-within .form-summary,
        .expandable-form.mobile-expanded .form-summary {
            font-size: 1.8rem; justify-content: flex-start;
            margin-bottom: 25px; text-shadow: 2px 2px 0px #fff;
        }

        /* Trik Grid untuk Animasi Tinggi Form yang Super Smooth */
        .form-inputs-wrapper {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.6s var(--ease-smooth);
        }
        .expandable-form:hover .form-inputs-wrapper, 
        .expandable-form:focus-within .form-inputs-wrapper,
        .expandable-form.mobile-expanded .form-inputs-wrapper {
            grid-template-rows: 1fr;
        }
        
        .form-inputs-inner {
            overflow: hidden; opacity: 0; transform: translateY(20px);
            transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s;
        }
        .expandable-form:hover .form-inputs-inner, 
        .expandable-form:focus-within .form-inputs-inner,
        .expandable-form.mobile-expanded .form-inputs-inner {
            opacity: 1; transform: translateY(0);
        }

        /* Input Styles */
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        input {
            width: 100%; padding: 18px; font-size: 1.1rem; font-weight: 700;
            background: rgba(255,255,255,0.7); border: 3px solid var(--border-color);
            border-radius: 12px; outline: none; transition: all 0.3s;
        }
        input:focus { background: #fff; box-shadow: 5px 5px 0px var(--shadow-color); transform: translate(-2px, -2px); }
        
        button.btn-add {
            margin-top: 20px; width: 100%; padding: 18px; font-size: 1.2rem; font-weight: 900;
            background: var(--btn-cyan); border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color); border-radius: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        button.btn-add:hover { transform: translate(-3px,-3px); box-shadow: 9px 9px 0px var(--shadow-color); background: #55c2ff;}
        button.btn-add:active { transform: translate(4px,4px); box-shadow: 0px 0px 0px var(--border-color); }

        /* ========================================================
           SUPER UPGRADE 2: HOVER EXPANDING VIDEO CARDS 
           ======================================================== */
        #links-container { display: flex; flex-direction: column; gap: 20px; align-items: center; }

        .card-wrapper-flex { width: 100%; display: flex; justify-content: center; }

        .dynamic-video-card {
            background: var(--btn-yellow); /* Awalnya Kuning Solid */
            border: var(--border-width) solid var(--border-color);
            box-shadow: 6px 6px 0px var(--shadow-color);
            border-radius: 50px; /* Bentuk Kapsul Kecil */
            width: 320px; /* Lebar kecil (Tombol) */
            padding: 15px 30px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.6s var(--ease-bounce);
        }

        .dynamic-video-card:hover, .dynamic-video-card.expanded {
            width: 100%; /* Melebar full */
            border-radius: 16px;
            background: var(--glass-green); /* Menjadi Hijau Transparan/Kaca */
            backdrop-filter: var(--glass-blur);
            padding: 30px;
            box-shadow: 12px 12px 0px var(--shadow-color);
        }

        .card-summary {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.3rem; font-weight: 900; white-space: nowrap;
        }
        .card-summary .video-title { overflow: hidden; text-overflow: ellipsis; }
        .expand-icon { transition: transform 0.4s var(--ease-bounce); }
        
        .dynamic-video-card:hover .expand-icon, .dynamic-video-card.expanded .expand-icon {
            transform: rotate(180deg) scale(1.3);
        }

        /* Trik Grid untuk Animasi Tinggi Video Card */
        .card-details-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.6s var(--ease-smooth); }
        .dynamic-video-card:hover .card-details-wrapper, .dynamic-video-card.expanded .card-details-wrapper { grid-template-rows: 1fr; }
        
        .card-details-inner { overflow: hidden; opacity: 0; transition: opacity 0.4s ease 0.1s, margin-top 0.4s; }
        .dynamic-video-card:hover .card-details-inner, .dynamic-video-card.expanded .card-details-inner {
            opacity: 1; margin-top: 25px;
        }

        .btn-delete {
            width: 100%; margin-top: 20px; padding: 12px; font-weight: 900; font-size: 1.1rem;
            background: var(--btn-red); color: #fff; border: 3px solid var(--border-color);
            box-shadow: 5px 5px 0px var(--shadow-color); border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0px var(--shadow-color); }
        .btn-delete:active { transform: translate(5px,5px); box-shadow: 0px 0px 0px #000; }

        /* TOAST */
        #custom-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--btn-yellow); border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color); padding: 15px 30px; border-radius: 12px;
            font-weight: 900; font-size: 1.1rem; z-index: 9999; transition: top 0.4s var(--ease-bounce);
        }
        #custom-toast.show { top: 30px; }

        @media (min-width: 768px) {
            .input-group { flex-direction: row; }
            .btn-delete { width: auto; float: right; }
            .card-details-inner::after { content: ""; display: table; clear: both; }
        }
    </style>
</head>
<body>
    
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Toast Notification -->
    <div id="custom-toast"><span id="toast-icon"></span> <span id="toast-message"></span></div>

    <div class="container">
        <!-- Header -->
        <header><h1>✨ MY SPACE ✨</h1></header>

        <!-- Video YouTube Utama -->
        <div class="video-wrapper">
            <div class="video-container">
                <iframe src="https://www.youtube-nocookie.com/embed/7TY11F_8_Go" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </div>

        <!-- SUPER UPGRADE 1: FORM HOVER EXPANDING -->
        <div class="form-wrapper-center">
            <div class="expandable-form" id="form-container">
                <!-- Tampilan Kecil (Tombol) -->
                <div class="form-summary">
                    <span>➕</span> <span>Tambah Video</span>
                </div>
                <!-- Tampilan Expanded (Isi Form) -->
                <div class="form-inputs-wrapper">
                    <div class="form-inputs-inner">
                        <form id="add-video-form">
                            <div class="input-group">
                                <input type="text" id="video-title" placeholder="Judul Video (Cth: Vlog)" required autocomplete="off">
                                <input type="text" id="video-embed" placeholder="Paste kode <iframe ...>" required autocomplete="off">
                            </div>
                            <button type="submit" class="btn-add">Tambahkan Sekarang!</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- SUPER UPGRADE 2: DAFTAR VIDEO HOVER EXPANDING -->
        <div id="links-container">
            <!-- Render video via JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-video-form');
            const formContainer = document.getElementById('form-container');
            const linksContainer = document.getElementById('links-container');
            const titleInput = document.getElementById('video-title');
            const embedInput = document.getElementById('video-embed');
            
            const toastEl = document.getElementById('custom-toast');
            const toastMsg = document.getElementById('toast-message');

            const STORAGE_KEY = 'neubrutalism_videos_super_expand';

            // Fitur Mobile: Klik Form untuk Expand (karena mobile tidak ada hover)
            formContainer.addEventListener('click', () => { formContainer.classList.add('mobile-expanded'); });

            // Menampilkan Toast Notif
            const showToast = (message, isSuccess = false) => {
                toastMsg.textContent = message;
                document.getElementById('toast-icon').textContent = isSuccess ? '✅' : '⚠️';
                toastEl.style.backgroundColor = isSuccess ? '#8CFF9E' : '#FFDE59';
                toastEl.classList.add('show');
                setTimeout(() => toastEl.classList.remove('show'), 3000);
            };

            const saveVideos = (videos) => localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));

            // Mendapatkan Data (Ditambah Dummy Data agar efek Hover Expand langsung terlihat)
            const getVideos = () => {
                let videos = JSON.parse(localStorage.getItem(STORAGE_KEY));
                // Jika kosong (pertama kali buka), berikan 1 video contoh
                if (!videos || videos.length === 0) {
                    videos = [{ title: "Hover Saya! (Contoh Expand)", src: "https://www.youtube-nocookie.com/embed/8Dly1Z08_Y8" }];
                    saveVideos(videos);
                }
                return videos;
            };

            const renderVideos = () => {
                linksContainer.innerHTML = ''; 
                const videos = getVideos();
                
                videos.forEach((video, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper-flex';

                    // Kartu Kecil yang bisa membesar
                    const card = document.createElement('div');
                    card.className = 'dynamic-video-card';
                    
                    // Logic Mobile: Tap card untuk expand
                    card.addEventListener('click', () => card.classList.toggle('expanded'));

                    // Bagian Tombol Kecil
                    const summaryDiv = document.createElement('div');
                    summaryDiv.className = 'card-summary';
                    summaryDiv.innerHTML = `<span class="video-title">📺 ${video.title}</span><span class="expand-icon">🔽</span>`;

                    // Bagian Expanded (Video + Hapus)
                    const detailsWrapper = document.createElement('div');
                    detailsWrapper.className = 'card-details-wrapper';
                    const detailsInner = document.createElement('div');
                    detailsInner.className = 'card-details-inner';

                    const vidContainer = document.createElement('div');
                    vidContainer.className = 'video-container';
                    vidContainer.innerHTML = `<iframe src="${video.src}" title="${video.title}" frameborder="0" allowfullscreen></iframe>`;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = 'HAPUS 🗑️';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation(); // Cegah klik memicu penutupan kartu
                        deleteVideo(index);
                    };

                    detailsInner.appendChild(vidContainer);
                    detailsInner.appendChild(deleteBtn);
                    detailsWrapper.appendChild(detailsInner);
                    card.appendChild(summaryDiv);
                    card.appendChild(detailsWrapper);
                    wrapper.appendChild(card);
                    
                    linksContainer.insertBefore(wrapper, linksContainer.firstChild);
                });
            };

            // Tambah Video Baru
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const newTitle = titleInput.value.trim();
                const embedCode = embedInput.value.trim();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = embedCode;
                const iframeTag = tempDiv.querySelector('iframe');
                
                let extractedSrc = '';
                if (iframeTag && iframeTag.src) {
                    extractedSrc = iframeTag.src.replace('youtube.com', 'youtube-nocookie.com');
                } else {
                    showToast('Gagal! Pastikan paste kode <iframe ...> lengkap.');
                    return; 
                }

                if(newTitle && extractedSrc) {
                    const videos = getVideos();
                    videos.push({ title: newTitle, src: extractedSrc });
                    saveVideos(videos);
                    
                    titleInput.value = ''; embedInput.value = '';
                    formContainer.classList.remove('mobile-expanded'); // Tutup form di mobile
                    
                    renderVideos();
                    showToast(`Berhasil menambahkan "${newTitle}"!`, true);
                }
            });

            // Hapus Video
            const deleteVideo = (index) => {
                const videos = getVideos();
                const deletedTitle = videos[index].title;
                videos.splice(index, 1); 
                saveVideos(videos); 
                renderVideos(); 
                showToast(`Video "${deletedTitle}" dihapus.`);
            };

            // Render awal saat halaman dimuat
            renderVideos();
        });
    </script>
</body>
</html>
